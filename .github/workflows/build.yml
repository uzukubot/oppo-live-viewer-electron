name: Build OPPO Live Viewer (Electron)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            build_cmd: "npx electron-builder --win portable"
            artifact: "portable-windows"
          - platform: "macos-latest" # Apple Silicon（用户仅有 ARM Mac）
            build_cmd: "npx electron-builder --mac zip --arm64"
            artifact: "portable-macos"
          - platform: "ubuntu-22.04"
            build_cmd: "npx electron-builder --linux AppImage"
            artifact: "portable-linux"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 构建 SvelteKit 前端（GITHUB_SHA 注入 commit 号）
      - name: 构建前端
        run: npm run build

      # electron-builder 按平台产出 portable 单文件
      - name: 构建 ${{ matrix.platform }}
        run: ${{ matrix.build_cmd }}

      - name: 取短 commit ID
        id: sha
        shell: bash # Windows runner 默认 PowerShell，需显式 bash 才能用 ${var::7} 子串
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 上传产物到 Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ steps.sha.outputs.short }}
          path: dist/**
          if-no-files-found: error
